<!doctype html>
<html>
<head>
	<meta charset="utf-8">
	<title>Zenith.js Demo</title>
	<meta name="description" content="">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" href="../css/demos.css">
	<style>
		@keyframes fade-in {
		    from {opacity:0;}
		    to {opacity:1;}
		}
		ul > li {
			animation: fade-in 2s forwards;
		}
	</style>
</head>
<body>
	<p>Creates a list where one item is added per animation frame, and animation plays when items are reshuffled or added</p>
	<div id="app"></div>
	<script type="module">
		import { elem, comp, mount } from '../../dist/zenith.js';
		let id = 1;
		const items = [];
		const shuffle = arr => {
			let currentIndex = arr.length,
				randomIndex;

			// While there remain elements to shuffle.
			while (currentIndex != 0) {
				// Pick a remaining element.
				randomIndex = Math.floor(Math.random() * currentIndex);
				currentIndex--;
				// And swap it with the current element.
				[arr[currentIndex], arr[randomIndex]] = [arr[randomIndex], arr[currentIndex]];
			}
			return arr;
		}
		const ListDef = {
			draw: vNode => elem('ul', vNode.attrs.items.map(item => elem('li', 'Item ' + item)))
		};
		const list = comp(ListDef, {
			items
		});
		const tick = () => {
			shuffle(items);
			items.push(id++);
			list.draw();
			window.requestAnimationFrame(tick);
		};
		while(id <= 1) {
			items.push(id++);
		}
		mount(document.querySelector('#app'), list);
		tick();
	</script>
</body>
</html>
