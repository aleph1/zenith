<!doctype html>
<html>
<head>
	<meta charset="utf-8">
	<title>Zenith.js Demo</title>
	<meta name="description" content="">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" href="../css/demos.css">
</head>
<body>
	<div id="app"></div>
	<script type="module">
		import { elem, comp, mount } from '../../dist/zenith.js';
		const appEl = document.querySelector('#app');
		const values = ['1', '2', '3'];
		const ListItem = {
			draw: vNode => elem('li',
				{
					onclick: e => {
						values[vNode.attrs.index] = null,
						remount();
					},
				}, vNode.attrs.value
			),
			remove: vNode => new Promise.resolve(resolve => setTimeout(() => resolve(true), 1000)),
			destroy: vNode => {
				values.splice(vNode.attrs.index, 1);
			},
		};

		const List = {
			draw: vNode => elem('ul',
				values.map((value, index) => comp(ListItem, {
	        index: index,
	        value: value,
	      }))
      ),
		};
		const remount = () => {
			mount(appEl, comp(List));
		};

		remount();
	</script>
</body>
</html>
