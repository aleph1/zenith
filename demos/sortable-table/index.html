<!doctype html>
<html>
<head>
	<meta charset="utf-8">
	<title>Zenith.js Demo</title>
	<meta name="description" content="">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" href="../css/demos.css">
	<style>
		:root {
			--fade-duration: 1s;
		}
		@keyframes fade-in {
		    from {opacity:0;}
		    to {opacity:1;}
		}
		@keyframes fade-out {
		    from {opacity:1;}
		    to {opacity:0;}
		}
		tr.fade-in {
			animation: fade-in var(--fade-duration) forwards;
		}
		tr.fade-out {
			animation: fade-out var(--fade-duration) forwards;
			pointer-events: none;
		}
	</style>
</head>
<body>
	<div id="app"></div>
	<script type="module">
		import { elem, comp, bind, draw } from '../../dist/zenith.development.js';
		
		let peopleCount = 0;
		let personId = 0;
		const setCSSVariable = (name, value) => document.documentElement.style.setProperty(name, value);
		const appEl = document.querySelector('#app');
		const fadeDuration = 1000;
		setCSSVariable('--fade-duration', fadeDuration + 'ms');
		
		const firstNames = ['Aki', 'Adam', 'Amy', 'Ang', 'Brianna', 'Bruce', 'Cassandra', 'Charles', 'Colette', 'Dae', 'Deion', 'Elijah', 'Emma', 'Han', 'Hiromi', 'Jackie', 'Jamal', 'Jin', 'Kalisha', 'Keysha', 'Lamonte', 'Liang', 'Naoki', 'Osamu'];
		const lastNames = ['Anderson', 'Barnes', 'Chan', 'Diaz', 'Ferguson', 'Hunt', 'James', 'Lee', 'McDonald', 'Olson', 'Ramirez', 'Singh', 'Smith', 'Wood'];
		const people = [];
		
		const animate = (dom, className, duration) => {
  		dom.classList.add(className);
  		setTimeout(() => dom.classList.remove(className), duration);
		};
		
		const addPerson = () => {
			const person = {
				id: ++personId,
				firstName: firstNames[Math.floor(Math.random() * firstNames.length)],
				lastName: lastNames[Math.floor(Math.random() * lastNames.length)],
				age: Math.floor(Math.random() * 60 + 18),
				deleted: false
			};
			people.push(person);
			peopleCount++;
		};
		
		const removePerson = id => {
			console.log('removePerson()');
			console.log('id: ' + id);
		  for(const person of people) {
		  	if(person.id === id) {
		  		person.deleted = true; // ← Mark as deleted, don't remove
		    	peopleCount--;
		    	return;
		    }
		 	}
		};
		
		const sortPeople = sortFn => {
			people.sort(sortFn);
		};
		
		for(let i = 0; i < 2; i++) {
			addPerson();
		}
		
		const shuffle = arr => {
			let currentIndex = arr.length, randomIndex;
			while (currentIndex !== 0) {
				randomIndex = Math.floor(Math.random() * currentIndex);
				currentIndex--;
				[arr[currentIndex], arr[randomIndex]] = [arr[randomIndex], arr[currentIndex]];
			}
		};

		const SortableTableRow = {
			draw: vNode => elem('tr',
				vNode.attrs.data.map(datum => elem('td', {
					class: datum.class,
				}, typeof datum.value === 'function' ? datum.value() : datum.value))
			),
			drawn: (vNode, isFirstDraw) => {
				if(isFirstDraw && vNode.dom) animate(vNode.dom, 'fade-in', fadeDuration);
			},
			remove: vNode => {
				console.log('SortableTableRow.remove()');
				console.log('key: ' + vNode.attrs.key);
			  vNode.dom.classList.add('fade-out');
			  return new Promise(resolve => setTimeout(resolve, fadeDuration));
			},
			destroy: vNode => {
				// Actually remove from array after fade completes
				for(let i = people.length - 1; i >= 0; i--) {
					if(people[i] && people[i].id === vNode.attrs.id) {
						people.splice(i, 1);
						return;
					}
				}
			}
		};

		const SortableTable = {
			draw: vNode => {
				return [
					elem('table',
						elem('thead',
							elem('tr',
								elem('th', {
									class: 'sort',
									onclick(e) {
										sortPeople((a,b) => a.id - b.id);
										draw(vNode);
									}
								}, 'ID'),
								elem('th', {
									class: 'sort',
									onclick(e) {
										sortPeople((a,b) => {
											const nameA = a.firstName.toUpperCase();
											const nameB = b.firstName.toUpperCase();
											if (nameA < nameB) return -1;
											if (nameA > nameB) return 1;
											return 0;
										});
										draw(vNode);
									}
								}, 'First Name'),
								elem('th', {
									class: 'sort',
									onclick(e) {
										sortPeople((a,b) => {
											const nameA = a.lastName.toUpperCase();
											const nameB = b.lastName.toUpperCase();
											if (nameA < nameB) return -1;
											if (nameA > nameB) return 1;
											return 0;
										});
										draw(vNode);
									}
								}, 'Last Name'),
								elem('th', {
									class: 'sort',
									onclick(e) {
										sortPeople((a,b) => a.age-b.age);
										draw(vNode);
									}
								}, 'Age'),
								elem('th'),
							)
						),
						elem('tbody',
						  people.map(person => comp(SortableTableRow, {
						    key: person.id,
						    $remove: person.deleted,  // ← Use $remove attribute
						    data: [
						      {
						        value: person.id,
						        class: 'r',
						      },
						      {
						        value: person.firstName,
						      },
						      {
						        value: person.lastName,
						      },
						      {
						        value: person.age,
						        class: 'r',
						      },
						      {
						        value: () => elem('button', {
						          onclick: e => {
						            removePerson(person.id);
						            draw(vNode);
						          }
						        }, 'x'),
						        class: 'c',
						      },
						    ],
						    id: person.id,
						  }))
						)
					)
				];
			},
		};

		const DemoControls = {
			draw: vNode => elem('div',
				elem('button', {
					onclick(e) {
						addPerson();
						draw(vNode);
					}
				}, 'add'),
				elem('button', {
					onclick(e) {
						shuffle(people);
						draw(vNode);
					}
				}, 'shuffle'),
				elem('button', {
					onclick(e) {
						people.push(people.shift());
						draw(vNode);
					}
				}, 'move first to last'),
				elem('button', {
					onclick(e) {
						people.unshift(people.pop());
						draw(vNode);
					}
				}, 'move last to first'),
				'Length: ' + peopleCount
			),
		};

		bind(appEl, [comp(DemoControls), comp(SortableTable)]);
	</script>
</body>
</html>
